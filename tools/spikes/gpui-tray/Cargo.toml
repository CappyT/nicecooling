[package]
name = "gpui-tray"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
async-channel = "2"
gpui-component = "0.10.0"
gpui-pre = "=0.3.12"
gpui-pre-platform = { version = "=0.3.12", features = ["wayland", "x11"] }
ksni = { version = "0.3.7", features = ["blocking"] }
notify-rust = "4.19"

[profile.release]
debug = false
