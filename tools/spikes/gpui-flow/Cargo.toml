[package]
name = "gpui-flow"
version = "0.1.0"
edition = "2024"
description = "A node-based flow graph editor for GPUI, inspired by React Flow / xyflow."
license = "MIT"
repository = "https://github.com/pacifio/gpui-flow"
homepage = "https://github.com/pacifio/gpui-flow"
publish = false

[workspace]

[dependencies]
gpui-pre = "=0.3.12"
gpui-pre-platform = { version = "=0.3.12", features = ["wayland", "x11"] }

[profile.release]
debug = false

[lints.clippy]
type_complexity = "allow"
