<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Install path: /usr/share/dbus-1/system.d/io.github.cappyt.NiceCooling1.conf -->
<busconfig>
  <!-- Only root owns the name. -->
  <policy user="root">
    <allow own="io.github.cappyt.NiceCooling1"/>
  </policy>

  <!-- Every user calls every method. polkit decides, see docs/api.md, section Authorization. -->
  <policy context="default">
    <allow send_destination="io.github.cappyt.NiceCooling1"/>
  </policy>
</busconfig>
