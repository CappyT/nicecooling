# The alarm poweroff of nicecoolingd must finish within 60 s of the end of the alarm delay.
# Delay inhibitors wait up to InhibitDelayMaxSec (5 s by default) before logind queues the job.
# A shutdown that stalls after that is forced at 55 s.
[Unit]
JobTimeoutSec=55s
JobTimeoutAction=poweroff-force
