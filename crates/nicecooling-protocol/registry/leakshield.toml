# LEAKSHIELD field registry. Source of truth for the report 3 fields, their risk class
# and their verification state. docs/protocol/leakshield.md describes the format.

schema_version = 1
model = "LEAKSHIELD"
firmware = 1022
structure = 100

[report3]
size = 750
structure_offset = 1
crc = { algorithm = "crc16_usb", first = 1, last = 747, offset = 748 }
# Byte offsets that the device changes by itself. Empty: no byte differs between the fw1019 and
# fw1022 dumps, and the code defines none. The Verification writes check it again.
volatile_mask = []

# Report 2 commands: output report 02, command u32 BE, parameter u32 BE, CRC-16/USB BE over the 8 bytes.
# No command names the pump runtime (docs/protocol/leakshield.md, open questions).
[[command]]
id = "restart"
code = 1
parameter = "0 or 1; the code does not define the difference"

[[command]]
id = "save_settings"
code = 2
parameter = "0"

[[command]]
id = "factory_defaults"
code = 3
parameter = "0"

[[command]]
id = "show_page"
code = 4
parameter = "page id << 16 | duration in 0.1 s"

[[command]]
id = "display_on"
code = 9
parameter = "0"

[[command]]
id = "display_off"
code = 10
parameter = "0"

[[command]]
id = "reset_alarm"
code = 11
parameter = "0"

[[command]]
id = "set_mode"
code = 12
parameter = "Mode or Action code"

[[command]]
id = "cancel_action"
code = 12
parameter = "0: stops the running Action"

[[command]]
id = "reset_refill_history"
code = 13
parameter = "0"

[[command]]
id = "reset_event_log"
code = 14
parameter = "0"

[[command]]
id = "set_fill_mode"
code = 15
parameter = "fill mode; values not defined in the code"

[[command]]
id = "suppress_alarm"
code = 16
parameter = "value / 25; aquasuite sends 90000 / 25 when the PC suspends"

[[command]]
id = "usb_reset"
code = 523
parameter = "0"

[[command]]
id = "disable_low_volume_alarm"
code = 14356
parameter = "65341"

[[command]]
id = "reset_service_counter"
code = 25000
parameter = "serial (report 1 bytes 3-6 as u32) XOR 0xFFFFFFFF"

[[command]]
id = "test_mode"
code = 25001
parameter = "129853 on, 958634 off"

[[command]]
id = "set_clock"
code = 37000
parameter = "seconds since 2009-01-01 00:00 UTC"

