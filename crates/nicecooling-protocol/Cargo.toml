[package]
name = "nicecooling-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The simulated Leakshield of `sim.rs`. Only `[dev-dependencies]` enable it.
sim = []

[dependencies]
base64.workspace = true
crc.workspace = true
roxmltree.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# The tests of `sim.rs` need the feature that the library keeps off by default.
nicecooling-protocol = { workspace = true, features = ["sim"] }
