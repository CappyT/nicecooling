[package]
name = "nicecooling"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nicecooling-api.workspace = true
nicecooling-core.workspace = true
nicecooling-graph.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
gpui-pre.workspace = true
gpui-pre-platform.workspace = true
ksni.workspace = true
notify-rust.workspace = true
rusqlite.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# gpui builds this version already. The app decodes the PNG of a logo or an icon with it.
image = { version = "0.25", default-features = false, features = ["png"] }
zbus.workspace = true
toml.workspace = true

[dev-dependencies]
gpui-pre = { workspace = true, features = ["test-support"] }
serde-saphyr = "1.2"
