[package]
name = "nicecoolingd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The test implementation of `Authorizer`. No release profile enables it.
test-support = []

[dependencies]
nicecooling-api.workspace = true
nicecooling-core.workspace = true
nicecooling-hwmon.workspace = true
nicecooling-protocol.workspace = true
nusb.workspace = true
rustix.workspace = true
sd-notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
toml.workspace = true
zbus.workspace = true
zbus_polkit.workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nicecooling-hwmon = { workspace = true, features = ["fake"] }
nicecoolingd = { path = ".", features = ["test-support"] }
roxmltree = "0.21"
tokio = { workspace = true, features = ["test-util"] }
