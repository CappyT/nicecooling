[workspace]
resolver = "3"
members = [
    "crates/nicecooling-core",
    "crates/nicecooling-graph",
    "crates/nicecooling-protocol",
    "crates/nicecooling-hwmon",
    "crates/nicecooling-api",
    "crates/nicecooling-flow",
    "crates/nicecoolingd",
    "crates/nicecooling",
    "tools/nicecooling-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
nicecooling-core = { path = "crates/nicecooling-core" }
nicecooling-graph = { path = "crates/nicecooling-graph" }
nicecooling-protocol = { path = "crates/nicecooling-protocol" }
nicecooling-hwmon = { path = "crates/nicecooling-hwmon" }
nicecooling-api = { path = "crates/nicecooling-api" }
nicecoolingd = { path = "crates/nicecoolingd" }
tokio = "1.54"
zbus = "6.5"
zbus_polkit = "6.0"
sd-notify = "0.5"
nusb = "0.2.9"
rustix = "1.1"
crc = "3.4"
fastrand = "2.5"
roxmltree = "0.21"
base64 = "0.22"
libc = "0.2"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
rusqlite = { version = "0.43", features = ["bundled"] }
ksni = { version = "0.3.7", features = ["blocking"] }
notify-rust = "4.19"
rust-i18n = "4.2"
rumqttc = { version = "=0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rcgen = "0.14"
lettre = { version = "=0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs"] }
gpui-component = "0.10.0"
gpui-kit-assets = "0.10.0"
gpui-pre = "=0.3.12"
gpui-pre-platform = { version = "=0.3.12", features = ["wayland", "x11"] }

[workspace.lints.cargo]
unused_dependencies = "allow"
